[workspace]
resolver = "2"
members = [
    "crates/peaudit-core",
    "crates/peaudit-cli",
    "crates/peaudit-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DmitriyKolesnikM8O/diplom"
authors = ["Dmitriy Kolesnik"]
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.10"
md-5 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
