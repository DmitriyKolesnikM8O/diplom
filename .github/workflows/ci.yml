name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        # Версия синхронизирована с rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Build release
        run: cargo build --workspace --release --locked

  msrv:
    name: check (MSRV 1.85)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        # Заявленный в Cargo.toml rust-version должен собираться на деле.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --locked

  check-32bit:
    name: check (i686)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        # Проверяет, что код не полагается на 64-битный usize.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: i686-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: i686

      - name: Check
        run: cargo check --workspace --all-targets --locked --target i686-unknown-linux-gnu

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check licenses, advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
